<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>합친 설정 창 데모 — 물감 창고 + 팔레트</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0969da; --accent-soft:#ddf4ff; --accent-line:#54aeff;
  --bg:#f6f8fa; --card:#ffffff; --sub:#f0f2f5;
  --text:#0d1117; --muted:#656d76; --border:#d0d7de;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e9edf1;font-family:'IBM Plex Sans KR',sans-serif;color:var(--text)}
.hint{max-width:1180px;margin:0 auto 12px;font-size:13px;color:#57606a}
.hint b{font-weight:600;color:var(--text)}
.win{max-width:1180px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.titlebar .sp{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}

.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.chip{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:#424a53;cursor:pointer;user-select:none}
.chip:hover{border-color:#8c959f}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:#0550ae;font-weight:500}
.chip .n{color:var(--muted);font-size:11px;margin-left:3px}
.chip.on .n{color:#0550ae}
.divider{width:1px;height:18px;background:var(--border);margin:0 4px}
.chip.tag{border-style:dashed;color:var(--muted)}
.search{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 10px;background:var(--card)}

.body{display:flex;align-items:flex-start}
.store{width:52%;padding:12px 14px;min-width:0}
.store.hid{display:none}
.grip{width:14px;align-self:stretch;background:var(--card);border-right:1px solid var(--border);border-left:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;user-select:none}
.grip:hover{background:var(--sub);color:var(--accent)}
.pal{flex:1;padding:12px 14px;min-width:0}

.cap{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin:0 0 8px}
.cap span{font-size:11px;font-weight:400;color:var(--muted)}
.sect{font-size:11px;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.sect::after{content:"";flex:1;height:1px;background:var(--border)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{border:1px solid var(--border);background:var(--card);border-radius:7px;padding:8px 9px;cursor:pointer;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.tile:hover{border-color:#8c959f}
.tile .nm{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.free{background:var(--accent-soft);border-color:var(--accent-line)}
.tile.free .nm{color:#0550ae}
.tile.free .s{color:#0969da}
.tile.here{background:#ffefe9;border-color:#f0997b}
.tile.here .nm{color:#8a3418}
.tile.here .s{color:#c0522a}
.tile.open{grid-column:1/-1;cursor:default;border:2px solid var(--accent);background:var(--card)}
.pv{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#424a53;background:var(--sub);border-radius:6px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;line-height:1.55;max-height:130px;overflow:auto}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.b{font-size:11.5px;border:1px solid var(--border);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--text)}
.b:hover{background:var(--sub)}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.pri:hover{background:#0757ba}
.newtile{border:1px dashed var(--accent-line);background:var(--card);color:var(--accent)}
.newtile .nm{color:var(--accent)}

.ptabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pt{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:#424a53}
.pt.on{background:var(--sub);border-color:#8c959f;color:var(--text);font-weight:500}
.grid{display:grid;gap:5px}
.cell{height:38px;border:1px dashed var(--border);border-radius:6px;background:transparent}
.cell.drop{border-color:var(--accent-line);background:#f0f8ff}
.blk{border:1px solid #8c959f;background:var(--card);border-radius:6px;font-size:11.5px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;line-height:1.25;white-space:pre-line;overflow:hidden}
.blk.just{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.empty{font-size:12px;color:var(--muted);padding:16px 0}
</style></head>
<body>
<p class="hint">데모입니다 — 실제 프로그램이 아니라 <b>library.json·config.json 의 진짜 데이터</b>로 그린 화면입니다. 물감을 눌러 펼치고, <b>팔레트에 놓기</b>를 눌러보세요. 왼쪽 세로 손잡이로 창고를 접습니다.</p>
<div class="win">
  <div class="titlebar"><span>⚙ 설정</span><span class="sp">물감 창고 + 팔레트 (합친 안)</span></div>
  <div class="chips" id="chips"></div>
  <div class="body">
    <div class="store" id="store"></div>
    <div class="grip" id="grip">⟨</div>
    <div class="pal" id="pal"></div>
  </div>
</div>
<script>
const DATA = {"tabs": [{"name": "메인", "cols": 8, "blocks": [{"label": "기본\n서식", "span": 2, "rows": 1, "row": 1, "col": 2, "type": "builtin"}, {"label": "글씨체", "span": 2, "rows": 1, "row": 0, "col": 2, "type": "function"}, {"label": "사진", "span": 2, "rows": 1, "row": 0, "col": 4, "type": "builtin"}, {"label": "특수문자", "span": 2, "rows": 1, "row": 0, "col": 6, "type": "builtin"}, {"label": "양식\n채우기", "span": 2, "rows": 1, "row": 1, "col": 0, "type": "builtin"}, {"label": "마크다운\n변환", "span": 2, "rows": 1, "row": 0, "col": 0, "type": "builtin"}]}, {"name": "수능", "cols": 8, "blocks": [{"label": "소1사진", "span": 2, "rows": 1, "row": 0, "col": 0, "type": "template"}, {"label": "소2사진", "span": 2, "rows": 1, "row": 0, "col": 2, "type": "template"}, {"label": "대1사진", "span": 2, "rows": 1, "row": 0, "col": 6, "type": "template"}, {"label": "수능양식", "span": 2, "rows": 1, "row": 0, "col": 4, "type": "form"}, {"label": "합답형1사진3선지", "span": 2, "rows": 1, "row": 1, "col": 0, "type": "template"}]}, {"name": "학교 시험문제", "cols": 15, "blocks": [{"label": "학교합답1사진5선지", "span": 5, "rows": 1, "row": 0, "col": 0, "type": "template"}]}, {"name": "부천여자중학교 원안지", "cols": 9, "blocks": [{"label": "발문", "span": 3, "rows": 1, "row": 0, "col": 0, "type": "template"}, {"label": "4보기", "span": 3, "rows": 1, "row": 2, "col": 0, "type": "template"}, {"label": "5보기", "span": 3, "rows": 1, "row": 3, "col": 0, "type": "template"}, {"label": "3행답안표", "span": 3, "rows": 1, "row": 0, "col": 6, "type": "template"}, {"label": "5행답안표", "span": 3, "rows": 1, "row": 1, "col": 6, "type": "template"}, {"label": "1행답안", "span": 3, "rows": 1, "row": 2, "col": 6, "type": "template"}, {"label": "2행답안", "span": 3, "rows": 1, "row": 3, "col": 6, "type": "template"}, {"label": "3행답안", "span": 3, "rows": 1, "row": 4, "col": 6, "type": "template"}, {"label": "5행답안", "span": 3, "rows": 1, "row": 5, "col": 6, "type": "template"}, {"label": "보기테스트", "span": 3, "rows": 1, "row": 4, "col": 0, "type": "template"}]}], "items": [{"cat": "문자", "name": "사각박스", "slots": 0, "preview": "■", "where": []}, {"cat": "템플릿", "name": "합답형1사진3선지", "slots": 12, "preview": "\\. \\\n\\\n이에 대한 설명으로 옳은 것을 <보기>에서 모두 고…\n〈보 기〉\n…", "where": ["수능"]}, {"cat": "템플릿", "name": "합답형2사진3선지", "slots": 13, "preview": "\\. \\\n\\\n\\\n그림(가)\n…", "where": []}, {"cat": "템플릿", "name": "합답형실험3선지", "slots": 11, "preview": "\\. \\\n[실험 과정]\n[실험 결과]\n이에 대한 설명으로 옳은 것을 <보기>에서 모두 고…\n…", "where": []}, {"cat": "템플릿", "name": "소1사진", "slots": 12, "preview": "\\.\n\\\n\\\n\\\n…", "where": ["수능"]}, {"cat": "템플릿", "name": "대1사진", "slots": 12, "preview": "\\.\n\\\n\\\n\\\n…", "where": ["수능"]}, {"cat": "템플릿", "name": "소2사진", "slots": 13, "preview": "\\.\n\\\n\\\n\\\n…", "where": ["수능"]}, {"cat": "템플릿", "name": "학교정답0사진1선지", "slots": 8, "preview": "\\.\n\\ (\\점)\n① \\\n② \\\n…", "where": []}, {"cat": "템플릿", "name": "학교합답2사진5선지", "slots": 14, "preview": "\\.\n\\\n\\\n\\\n…", "where": []}, {"cat": "템플릿", "name": "학교합답1사진5선지", "slots": 12, "preview": "\\.\n\\\n\\\n\\\n…", "where": ["학교 시험문제"]}, {"cat": "템플릿", "name": "가정통신문머리", "slots": 2, "preview": "학년/반\n\\\n학생 이름\n\\", "where": []}, {"cat": "템플릿", "name": "\\가통머리\\", "slots": 2, "preview": "학년/반\n\\\n학생 이름\n\\", "where": []}, {"cat": "템플릿", "name": "발문", "slots": 2, "preview": "1. \\ [\\점]", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "3보기", "slots": 3, "preview": "<보 기>\n\\\n\\\n\\", "where": []}, {"cat": "템플릿", "name": "4보기", "slots": 4, "preview": "<보 기>\n\\\n\\\n\\\n…", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "5보기", "slots": 5, "preview": "<보 기>\n\\\n\\\n\\\n…", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "3행답안표", "slots": 10, "preview": "(가)\n(나)\n(가)\n(나)\n…", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "5행답안표", "slots": 10, "preview": "(가)\n(나)\n①\n\\\n…", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "1행답안", "slots": 5, "preview": "① \\\n② \\\n③ \\\n④ \\\n…", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "2행답안", "slots": 5, "preview": "① \\ ② \\ ③ \\\n④ \\ ⑤ \\", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "3행답안", "slots": 5, "preview": "① \\ ② \\\n③ \\ ④ \\\n⑤ \\", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "5행답안", "slots": 5, "preview": "① \\\n② \\\n③ \\\n④ \\\n…", "where": ["부천여자중학교 원안지"]}, {"cat": "템플릿", "name": "지문박스", "slots": 0, "preview": "", "where": []}, {"cat": "템플릿", "name": "보기테스트", "slots": 1, "preview": "<보 기>\nㄱ. \\", "where": ["부천여자중학교 원안지"]}, {"cat": "양식", "name": "원안지", "slots": 0, "preview": "", "where": []}, {"cat": "양식", "name": "가정통신문", "slots": 0, "preview": "", "where": []}, {"cat": "양식", "name": "수능양식", "slots": 2, "preview": "", "where": ["수능"]}]};
let filter = "전체", openName = null, curTab = 0, justPlaced = null;
const CATS = ["서식","문자","템플릿","양식"];
const CATLABEL = {"서식":"서식","문자":"특수기호","템플릿":"템플릿","양식":"양식"};

function placedIn(it){ return it.where.length ? it.where : null; }

function renderChips(){
  const el = document.getElementById("chips");
  const counts = {전체: DATA.items.length};
  CATS.forEach(c => counts[c] = DATA.items.filter(i => i.cat === c).length);
  let h = "";
  h += chip("전체", counts["전체"]);
  CATS.forEach(c => h += chip(c, counts[c], CATLABEL[c]));
  h += '<span class="divider"></span>';
  h += '<span class="chip tag">#시험지</span><span class="chip tag">#원안지</span><span class="chip tag">＋ 태그</span>';
  h += '<span class="search">🔍 이름·라벨로 찾기</span>';
  el.innerHTML = h;
  el.querySelectorAll("[data-f]").forEach(n => n.onclick = () => { filter = n.dataset.f; openName = null; render(); });
}
function chip(key, n, label){
  const on = filter === key ? " on" : "";
  return `<span class="chip${on}" data-f="${key}">#${label || key}<span class="n">${n}</span></span>`;
}

function renderStore(){
  const el = document.getElementById("store");
  const list = DATA.items.filter(i => filter === "전체" || i.cat === filter);
  const here = DATA.tabs[curTab].name;
  const rank = i => !placedIn(i) ? 0 : (i.where.includes(here) ? 1 : 2);
  const sorted = list.slice().sort((a,b) => rank(a) - rank(b));
  let h = `<div class="cap">물감 창고 <span>파랑 = 어디에도 안 놓임 · 코랄 = '${here}' 에 있음</span></div>`;
  h += `<div class="tiles">`;
  h += `<div class="tile newtile" onclick="alert('데모입니다 — 실제로는 한글에서 선택한 영역이 새 물감으로 들어옵니다')"><div class="nm">＋ 새 물감</div><div class="s">지금 선택 영역으로</div></div>`;
  sorted.forEach(i => h += tile(i, rank(i)));
  h += `</div>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-open]").forEach(n => n.onclick = e => {
    if (e.target.closest(".acts")) return;
    openName = (openName === n.dataset.open) ? null : n.dataset.open;
    render();
  });
}
function tile(i, rank){
  const cls = rank === 0 ? "free" : (rank === 1 ? "here" : "");
  const sub = i.slots ? "빈칸 " + i.slots : "";
  if (openName === i.name){
    const pv = (i.preview || "(미리보기 없음)").replace(/</g,"&lt;");
    return `<div class="tile open ${cls}" data-open="${i.name}">
      <div class="nm">${i.name}</div><div class="s">#${CATLABEL[i.cat]}${sub ? " · " + sub : ""}</div>
      <div class="pv">${pv}</div>
      <div class="acts">
        ${rank === 1 ? `<span class="b" onclick="alert('데모 — 이 탭에서 치웁니다')">이 탭에서 치우기</span>`
                     : `<span class="b pri" onclick="place('${i.name}')">이 팔레트에 놓기</span>`}
        <span class="b">꺼내서 고치기</span><span class="b">이름·태그</span><span class="b">지우기</span>
      </div></div>`;
  }
  return `<div class="tile ${cls}" data-open="${i.name}">
    <div class="nm">${i.name}</div><div class="s">${sub || "&nbsp;"}</div></div>`;
}

function place(name){
  const it = DATA.items.find(i => i.name === name);
  const tab = DATA.tabs[curTab];
  const cols = tab.cols || 8;
  const taken = {};
  tab.blocks.forEach(b => { for(let c=0;c<b.span;c++) for(let r=0;r<b.rows;r++) taken[(b.row+r)+","+(b.col+c)] = 1; });
  const span = Math.min(3, cols);
  let put = null;
  for (let r=0; r<12 && !put; r++)
    for (let c=0; c+span<=cols && !put; c++){
      let ok = true;
      for (let k=0;k<span;k++) if (taken[r+","+(c+k)]) ok = false;
      if (ok) put = {row:r, col:c};
    }
  if (!put) { alert("이 탭에 빈 자리가 없습니다."); return; }
  tab.blocks.push({label:it.name, span:span, rows:1, row:put.row, col:put.col, type:"template"});
  it.where.push(tab.name);
  justPlaced = it.name; openName = null;
  render();
  setTimeout(() => { justPlaced = null; render(); }, 1600);
}

function renderPal(){
  const el = document.getElementById("pal");
  let h = `<div class="cap">팔레트</div><div class="ptabs">`;
  DATA.tabs.forEach((t,i) => h += `<span class="pt ${i===curTab?"on":""}" data-t="${i}">${t.name}</span>`);
  h += `<span class="pt">＋</span></div>`;
  const tab = DATA.tabs[curTab], cols = tab.cols || 8;
  let maxRow = 0; tab.blocks.forEach(b => maxRow = Math.max(maxRow, b.row + b.rows));
  const rows = Math.max(maxRow + 1, 4);
  h += `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">`;
  const at = {};
  tab.blocks.forEach(b => at[b.row+","+b.col] = b);
  const skip = {};
  tab.blocks.forEach(b => { for(let c=0;c<b.span;c++) for(let r=0;r<b.rows;r++) if(c||r) skip[(b.row+r)+","+(b.col+c)]=1; });
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    const k = r+","+c;
    if (skip[k]) continue;
    const b = at[k];
    if (b) h += `<div class="blk ${justPlaced===b.label?"just":""}" style="grid-column:span ${b.span};grid-row:span ${b.rows}">${b.label}</div>`;
    else h += `<div class="cell"></div>`;
  }
  h += `</div>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-t]").forEach(n => n.onclick = () => { curTab = +n.dataset.t; render(); });
}

function render(){ renderChips(); renderStore(); renderPal(); }
document.getElementById("grip").onclick = function(){
  const s = document.getElementById("store");
  s.classList.toggle("hid");
  this.textContent = s.classList.contains("hid") ? "⟩" : "⟨";
};
render();
</script>
</body></html>
